<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>完成任務的提醒阿姨</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
        <h1 id="header-title">任務提醒 | 完成任務的提醒阿姨 👵</h1>
    <p id="progress-message"></p>
    </header>

    <div class="task-container">
        <table id="task-table">
            <thead>
                <tr>
                    <th>任務名稱</th>
                    <th>所需時間 (每次)</th>
                    <th>預計需要幾次</th>
                    <th>完成 (✔)</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>

    <script src="script.js"></script> 
</body>
</html>
